<!DOCTYPE html>
<html>
    <head>
        <title>Flexbox Practice</title>
    </head>
    <body style="padding-bottom: 1000px;">
        <!-- setting display to flex is how you make a flexbox -->
        <!-- flex-direction row means the elements within the flexbox will be aligned horizontally -->
        <div style="
            display: flex;
            flex-direction: row;
        ">
            <!-- the flexbox elements only take up as much space as needed -->
            <!-- if one div has more vertical stuff, all divs still maintain vertical alignment -->
            <div style="background-color: lightblue">div 1 text</div>
            <div style="background-color: lightpink">div 2 <p>text</p></div>
        </div>

        <div style="
            margin-top: 30px;
            display: flex;
            flex-direction: row;
        ">
            <!-- flex: 1 is the flexbox equivalent of 1fr (takes up the remaining amount of free space) -->
            <div style="background-color: lightblue;
                        width: 100px;
            ">100px</div>
            <div style="background-color: lightpink;
                        flex: 1;
            ">flex: 1</div>
        </div>

        <div style="
            margin-top: 30px;
            display: flex;
            flex-direction: row;
        ">
            <!-- flex 2 is equivalent to 2fr in grid. it is still like ratios -->
            <!-- flex 1 + flex 2 = 3. so 1/3 = a third of the free space, 2/3 = two thirds of it -->
            <div style="background-color: lightblue;
                        width: 100px;
            ">100px</div>
            <div style="background-color: lightpink;
                        flex: 1;
            ">flex: 1</div>
            <div style="background-color: lightblue;
                        flex: 2;
            ">flex: 2</div>
        </div>

        <!-- justify-content determines where the items in the flexbox are horizontally aligned -->
        <div style="
            margin-top: 30px;
            height: 70px;
            border-width: 1px;
            border-style: solid;
            border-color: gray;

            display: flex;
            flex-direction: row;
            justify-content: center;
        ">
            <div style="background-color: lightblue;
                        width: 100px;
            ">100px</div>
            <div style="background-color: lightpink;
                        width: 100px;
            ">100px</div>
            <div style="background-color: lightblue;
                        width: 100px;
            ">100px</div>
        </div>

        <!-- space-between spreads out the elements equally along the horizontal space -->
        <div style="
            margin-top: 30px;
            height: 70px;
            border-width: 1px;
            border-style: solid;
            border-color: gray;

            display: flex;
            flex-direction: row;
            justify-content: space-between;
        ">
            <div style="background-color: lightblue;
                        width: 100px;
            ">100px</div>
            <div style="background-color: lightpink;
                        width: 100px;
            ">100px</div>
            <div style="background-color: lightblue;
                        width: 100px;
            ">100px</div>
        </div>

        <!-- align-items determines how the items are aligned vertically -->
        <!-- default value is stretch: stretch to fill the space, start: only take up as much space as needed at the top -->
        <!-- end: same as start but at the bottom, center: vertically centered but only take up space as needed -->
        <div style="
            margin-top: 30px;
            height: 70px;
            border-width: 1px;
            border-style: solid;
            border-color: gray;

            display: flex;
            flex-direction: row;
            justify-content: space-between;
            align-items: stretch;
        ">
            <div style="background-color: lightblue;
                        width: 100px;
            ">100px</div>
            <div style="background-color: lightpink;
                        width: 100px;
            ">100px</div>
            <div style="background-color: lightblue;
                        width: 100px;
            ">100px</div>
        </div>
    </body>
</html>
