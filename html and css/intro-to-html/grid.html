<!DOCTYPE html>
<html>
    <head>
        <title>Grid Practice</title>
    </head>

    <body style="padding-bottom: 1000px;">
        <!-- can use the style attribute to write css directly inside an html element -->
        <!-- this is called inline styles -->
        <!-- generally not used on websites, good for just practicing/showing -->
        <div style="
            display: grid;
            grid-template-columns: 100px 100px; 
        ">
            <div style="background-color: lightblue">div 1</div>
            <div style="background-color: lightpink">div 2
                <p>text</p>
            </div>
        </div>

        <!-- for grid-template-columns, the number of columns is determined by the amount of values you give it-->
        <!-- you need a div for each value, or else all the columns wont show -->
        <div style="
            margin-top: 30px;
            display: grid;
            grid-template-columns: 100px 100px 200px; 
        ">
            <div style="background-color: lightblue">100px</div>
            <div style="background-color: lightpink">100px
                <p>text</p>
            </div>
            <div style="background-color: lightblue">200px</div>

            <!-- whenever we have more elements than we do have columns, it wraps around and creates more rows-->
            <div style="background-color: lightpink">100px</div> 
        </div>

        <!-- fr is a special value in grid which means to take up the remaining amount of free space -->
        <div style="
            margin-top: 30px;
            display: grid;
            grid-template-columns: 100px 1fr; 
        ">
            <div style="background-color: lightblue">100px</div>
            <div style="background-color: lightpink">1fr</div>
        </div>

        <!-- the number in front of fr determined how much of the free space they get -->
        <!-- its like a ratio. 1+2 = 3. so 1fr = 1/3 free space. 2fr = 2/3 free space -->
        <div style="
            margin-top: 30px;
            display: grid;
            grid-template-columns: 100px 1fr 2fr; 
        ">
            <div style="background-color: lightblue">100px</div>
            <div style="background-color: lightpink">1fr</div>
            <div style="background-color: lightblue">2fr</div>
        </div>

        <!-- use only 1fr if you want everything equal -->
        <!-- if you add more elements (divs) than there are values in the grid-template-columns, it will 
         make a new row-->
        <div style="
            margin-top: 30px;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr; 
            column-gap: 20px;
            row-gap: 40px;
        ">
            <div style="background-color: lightblue; height: 200px;">1fr</div>
            <div style="background-color: lightpink; height: 200px;">1fr</div>
            <div style="background-color: lightblue; height: 200px;">1fr</div>
            <div style="background-color: lightpink; height: 200px;">1fr</div>
            <div style="background-color: lightblue; height: 200px;">1fr</div>
            <div style="background-color: lightpink; height: 200px;">1fr</div>
        </div>
    </body>
</html>
