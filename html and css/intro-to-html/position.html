<!DOCTYPE html>
<html>
    <head>
        <title>Position Practice</title>
    </head>

    <!-- use padding in the body element to add space on whatever side -->
    <body style="
        height: 3000px;
        padding-top: 60px;
        padding-left: 80px;
    ">
        <!-- css position is just the position element -->
        <!-- fixed is how we make something stick (remains there as you scroll) -->
        <!-- with fixed it only takes up as much space as needed, as its kinda floating above the page now -->
        <!-- you can manipulate its position with: top, left, right, and bottom -->
        <!-- if you do two opposing directions, it will stretch -->

        <!-- z-index determines which layer something is shown on. default is 0, so if you have value of 1
         it will be above everything -->
        <div style="
            background-color: black;
            color: white;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 50px;
            z-index: 100;
        ">header</div>

        <div style="
            background-color: green;
            color: white;
            position: fixed;
            bottom: 0;
            left: 0;
            top: 50px;
            width: 72px;
        ">
            sidebar

            <!-- if a position absolute is placed inside another element, its top, right, etc values are 
             determined based on the thing it is inside. -->
            <!-- super useful for this -->
            <div style="
                position: absolute;
                background-color: red;
                color: white;
                top: 0;
                right: 0;
            ">
                X
            </div>
        </div>

        <!-- for position fixed, the elements are placed in the browser window -->
        <!-- but for position absolute, the elements are placed on the page -->
        <div style="
            position: absolute;
            background-color: red;
            color: white;
            top: 60px;
            right: 10px;
        ">absolute</div>

        <div style="
            background-color: lightblue;
            height: 200px;
            width: 200px;
            position: static;
        ">div 1</div>

        <!-- position relative is mainly good for putting position absolutes inside and keep it relative to the page-->
        <div style="
            background-color: lightpink;
            height: 200px;
            width: 200px;
            position: relative;
        ">
            div 2
            <div style="
                position: absolute;
                background-color: black;
                color: white;
                bottom: 10px;
                right: 10px;
            ">
                5:00
            </div>
        </div>
    </body>
</html>
