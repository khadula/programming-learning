<!DOCTYPE html> <!-- must be at the start of every html file - tells the browser to use html -->
<html> <!-- everything in the webpage must be inbetween the html tags -->
    <head>
        <title> First Website </title>
    </head>
    <body> <!-- everything visible on the page must go inside the body element -->
        <!-- paragraph element -->
        <p> paragraph </p>

        <!-- button element -->
        <button> Button </button>

        <!-- link - <a> is used to make the link, but href is used to set the link 
            - href is an html attribute (modifies how an element behaves)
            - target determines where the link opens (_blank puts it in new tab)    -->

        <a href="https://www.google.com" target="_blank"> Link to Google </a>
    </body>
</html>
