<!DOCTYPE html>
<html>
    <head>
        <title>Buttons Practice</title>

        <!-- link is a void element - doesn't need a closing tag - link needs 2 attributes (rel and href)-->
        <link rel="stylesheet" href="styles/buttons.css"> <!-- rel means relation (determines what type of thing 
                                                    we're linking) -->
    </head>
    <body>
        <!-- class attributes allows us to label html elements (so we can target them specifically with css)-->
        <button class="subscribe-button"> SUBSCRIBE </button>
        <button class="join-button"> JOIN </button>
        <button class="tweet-button"> Tweet </button>
    </body>
</html>
