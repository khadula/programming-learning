<!DOCTYPE html>
<html>
    <head>
        <title> Lesson 11 Exercises </title>

        <style>
            .friend-preview {
                font-family: Arial;
                box-shadow: 5px 5px 10px 2px rgba(0, 0, 0, 0.3);
                border-radius: 2px;
            }

            .add-friend-button {
                background-color: rgb(28, 104, 218);
                border: none;
                color: white;
                border-radius: 3px;
                padding-top: 10px;
                padding-bottom: 10px;
                padding-left: 20px;
                padding-right: 20px;
                margin-left: 8px;
                margin-bottom: 8px;
            }

            .cat {
                width: 100%;
                height: 800px;
                object-fit: cover;
            }

            .name {
                font-weight: bold;
                font-size: 20px;
                margin-bottom: 2px;
                margin-left: 8px;
                margin-top: 5px;
            }

            .mutuals {
                color: grey;
                font-size: 15px;
                margin-top: 2px;
                margin-bottom: 8px;
                margin-left: 8px;
            }

            .preview-grid {
                display: grid;
                grid-template-columns: 1fr 1fr 1fr;
                column-gap: 30px
            }
        </style>
    </head>
    <body>
        <div class="preview-grid">
            <div class="friend-preview">
                <img class="cat" src="images/cat.webp">

                <p class="name">
                    Oliver
                </p>

                <p class="mutuals">
                    2 mutual friends
                </p>

                <button class="add-friend-button">
                    Add Friend
                </button>
            </div>

            <div class="friend-preview">
                <img class="cat" src="images/cat2.jpg">

                <p class="name">
                    Jeffrey
                </p>

                <p class="mutuals">
                    1 mutual friends
                </p>

                <button class="add-friend-button">
                    Add Friend
                </button>
            </div>

            <div class="friend-preview">
                <img class="cat" src="images/cat3.jpg">

                <p class="name">
                    Susie
                </p>

                <p class="mutuals">
                    4 mutual friends
                </p>

                <button class="add-friend-button">
                    Add Friend
                </button>
            </div>
        </div>
        
    </body>
</html>
