<!DOCTYPE html>
<html>
    <head>
        <title>Lesson 12 Exercises</title>
        <style>
            .flexbox {
                background-color: rgb(145, 29, 240);
                display: flex;
                height: 55px;

                flex-direction: row;
                align-items: center;
            }

            .left {
                color: white;
                width: 100px;
                text-align: center;
            }

            .middle {
                flex: 1;
                margin-left: 50px;
                margin-right: 50px;
                max-width: 700px; 
            }

            .search {
                border: none;
                padding-top: 10px;
                padding-bottom: 10px;
                width: 100%;
                color: gray;
                border-radius: 20px;
                padding-left: 20px;
            }

            .right {
                width: 100px;
                margin-left: 0px;
                text-align: center;
            }

            .download {
                border-color: white;
                border-radius: 2px;
                background-color: transparent;
                color: white;
                border-width: 1px;
                border-color: white;
                padding-top: 10px;
                padding-bottom: 10px;
                padding-right: 20px;
                padding-left: 20px;

            }
        </style>
    </head>

    <body>
        <div class="flexbox">
            <div class="left">
                <strong>Home</strong>
            </div>

            <div class="middle">
                <input class="search" type="text" placeholder="Search">
            </div>

            <div class="right">
                <button class="download">Download</button>
            </div>
        </div>
    </body>
</html>
