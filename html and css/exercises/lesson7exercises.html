<!DOCTYPE html>
<html>
    <head>
        <title>Lesson 7 Exercises</title>

        <style>
            .exercise7a {
                width: 200px;
                border-radius: 20px;
                margin-right: 50px;
            }

            .exercise7b {
                width: 150px;
                height: 150px;
                object-fit: cover;
                margin-right: 50px;
            }

            .exercise7c {
                width: 150px;
                height: 150px;
                object-fit: cover;
                border-radius: 75px;
            }

            .google-search {
                border: none;
                box-shadow: 3px 3px 10px rgba(0, 0, 0, 0.2);
                width: 300px;
                height: 30px;
                border-radius: 15px;
                padding-left: 15px;
            }

            .exercise7g-cat {
                width: 50px;
                height: 50px;
                object-fit: cover;
                border-radius: 75px;
                vertical-align: middle;
            }

            .exercise7g {
                margin-top: 100px;
                display: flex;
            }

            .exercise7g-text {
                color: rgb(100, 100, 100);
                vertical-align: middle;
                margin-left: 20px;
                font-size: 20px;
            }

            .exercise7g-button {
                margin-left: 80px;
                border: none;
                vertical-align: middle;
                background-color: rgb(0, 174, 255);
                padding: 50px 30px;
                color: white;
                font-weight: bold;
                border-radius: 30px;
                font-size: 18px;
                line-height: 1;
            }

        </style>
    </head>

    <body>
        <img class="exercise7a" src="images/cat.webp">

        <img class="exercise7b" src="images/cat.webp">

        <img class="exercise7c" src="images/cat.webp">

        <input class="google-search" type="textbox" placeholder="Search google or type a URL">

        <div class="exercise7g">
            <img class="exercise7g-cat" src="images/cat.webp">
            <p class="exercise7g-text"> What's Happening? </p>
            <button class="exercise7g-button"> Tweet </button>
        </div>
        
    </body>
</html>
