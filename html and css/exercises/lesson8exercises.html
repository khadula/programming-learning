<!DOCTYPE html>
<html>
<head>
    <title>Lesson 8 Exercises</title>

    <style>
        .request-text {
            font-size: 30px;
            font-family: Arial;
        }

        input {
            display: block;
            background-color: rgb(235, 235, 235);
            color: rgb(88, 87, 87);
            border: none;
            padding-left: 15px;
            padding-right: 100px;
            padding-top: 10px;
            padding-bottom: 10px;
            margin-bottom: 10px;
        }

        button {
            display: inline-block;
            border: none;
            padding: 10px 15px;
            margin-top: 20px;
        }

        .request-button {
            color: white;
            background: black;
        }

        .schedule-button {
            margin-left: 15px;
        }


    </style>
</head>
<body>
    <p class="request-text"> Request a ride now </p>
    <input type="textbox" placeholder="Enter pickup location">
    <input type="textbox" placeholder="Enter destination">
    <button class="request-button">Request now</button>
    <button class="schedule-button">Schedule for later</button>
</body>
</html>
