<!DOCTYPE html>
<html>
    <head>
        <title>Variables</title>

    </head>
    <body>
        <script>
            // let is used to create a variable in js
            let variable1 = 3;
            console.log(variable1);

            let calculation = 6 + 7;
            console.log(calculation);

            let result = calculation + 2;
            console.log(result);

            let message = 'hello';
            // this works in js because js has 'semicolon insertion' where it tries to insert one at the end of a line
            console.log(message); console.log(';')

            // variable reassign
            variable1 = 42;

            /* ----------------------------------------- */
            // const is how u make a constant in js
            const pi = 3.14;

            // best practice to always use const unless you know you will be changing a variable

            // old way - var - has some issues
            var variable3 = 3
        </script>
    </body>
</html>
