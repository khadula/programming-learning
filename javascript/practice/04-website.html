<!DOCTYPE html>
<html>
    <head>
        <title>Website WOWOW</title>
        <style>
            button {
                background-color: lightpink;
            }
        </style>
    </head>
    <body>
        <!-- can also put javascript inside an onclick attribute -->
        <button title="button" onclick="
            alert('wow you did it')
        ">click</button>

        <!-- can type javascript inside script tags -->
        <script>
            // this is a single line comment in javascript
            alert("hi");

            /* 
            this is a multi line comment in java
            */

            // displays something in console (pretty much just javascript equivalent of print)
            console.log(6+7);
        </script>

    </body>
</html>
