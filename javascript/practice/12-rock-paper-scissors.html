<!DOCTYPE html>
<html>
    <head>
        <title>Rock Paper Scissors</title>

    </head>
    <body>
        <p>Rock Paper Scissors</p>
            
        <button onclick="
            playGame('rock');
        ">Rock</button>

        <button onclick="
            playGame('paper');
        ">Paper</button>

        <button onclick="
            playGame('scissors');
        ">Scissors</button>

        <p class="js-result"></p>

        <p class="js-score"></p>


        <button onclick="
            score.wins = 0;
            score.losses = 0;
            score.ties = 0;
            localStorage.removeItem('score');
            updateScoreElement();
        ">Reset Score</button>

        <button class="js-auto-play-button" onclick="
            autoPlay();
        ">Auto Play</button>

        <script src="scripts/12-rock-paper-scissors.js"></script>
    </body>
</html>
