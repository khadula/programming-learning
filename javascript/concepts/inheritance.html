<!DOCTYPE html>
<html>
    <head>
        
    </head>
    <body>
        <script>
            // inheritance
            // - allows a new class to inherit properties and methods from an existing class
            // - parent -> child
            // - helps with code reusability

            class Animal {
                alive = true;

                eat() {
                    console.log(`This ${this.name} is eating`);
                }

                sleep() {
                    console.log(`This ${this.name} is sleep`);
                }
            
            }

            // each child class can have their own unique methods, while inheriting parents methods
            class Rabbit extends Animal {
                name = "rabbit";

                run() {
                    console.log(`This ${this.name} is running`);
                }
            }

            class Fish extends Animal {
                name = "fish";

                swim() {
                    console.log(`This ${this.name} is swimming`);
                }
            }

            class Hawk extends Animal {
                name = "hawk";

                fly() {
                    console.log(`This ${this.name} is flying`);
                }
            }

            // these all inherit the methods of the Animal class
            const rabbit = new Rabbit();
            const fish = new Fish();
            const hawk = new Hawk();

            rabbit.eat();
            hawk.sleep();
            console.log(fish.alive);

            hawk.fly();
            fish.swim();
            rabbit.swim();

        </script>
    </body>
</html>
