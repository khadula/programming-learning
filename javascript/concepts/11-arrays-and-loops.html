<!DOCTYPE html>
<html>
    <head>
        <title>Arrays and Loops</title>

    </head>
    <body>
        <script>
            /* ------------------- ARRAY PRACTICE ---------------------- */
            // syntax for arrays in js
            const myArray = [
                10,
                20,
                30
            ];
            console.log(myArray);

            console.log(myArray[0]);
            myArray[0] = 99;
            console.log(myArray[0]);

            // can put any datatype in an array
            const coolArray = [
                1,
                'hello',
                true,
                {name: 'socks'},
                [1, 2]
            ]

            // type of shows that an array is an object
            console.log(typeof [1, 2]);

            // if we want to check if an array is actually an array
            console.log(Array.isArray([1, 2]));

            // arrays have different methods
            console.log(myArray.length);
            myArray.push(100);  // adds 100 to the end of the array

            // 1st value is the index at which we want to remove
            // 2nd value is how many values to remove starting from that index
            myArray.splice(0, 2);
            console.log(myArray);

            /* --------------------- LOOP PRACTICE ----------------------- */
            // syntax for while loops in js - if its a less standard loop, use while
            let i = 0;
            while (i <= 5) {
                console.log(i);
                i++;
            }

            // synatx for a for loop in js - if its a more standard loop, use for loop
            for (let i = 1; i <= 5; i++) {
                console.log('hello' + i);
            }

            // looping an array syntax in js
            const loopArray = [69, 420, 999];
            for (let i = 0; i < loopArray.length; i++) {
                console.log(loopArray[i]);
            }

            // example of a non-standard loop (loop where you have to keep going till you hit something)
            // while loops are just more flexible
            let randomNumber = 0;
            while (randomNumber < 0.5) {
                randomNumber = Math.random();
            }

            // accumulator pattern in js
            const nums = [1, 1, 3];
            let total = 0;
            for (let i = 0; i < nums.length; i++) {
                total = total + nums[i];
            }
            console.log(total);
            
            // accumulator pattern but with array accumulator
            const numsDoubled = [];
            for (let i = 0; i < nums.length; i++) {
                numsDoubled.push(nums[i]*2);
            }
            console.log(numsDoubled);


            /* ----------------------------- MORE ARRAY STUFF ------------------------------- */
            // arrays are references - these both just have the same reference to the area in storage
            const array1 = [1,2,3];
            const array2 = array1;

            array2.push(4);
            console.log(array1);
            console.log(array2);
            // they both show 4

            // to avoid this, use .slice()
            const arrayCopy = array1.slice();
            arrayCopy.push(5);
            console.log(array1);
            console.log(arrayCopy);
            // arrayCopy now has a new reference


            // destructuring - easier way to get variables out of arrays and save them
            const [firstValue, secondValue] = [1, 2, 3];    // firstValue has the value of the index 0, etc


            /* ------------------------------- MORE LOOP STUFF ------------------------------------ */
            // break and continue syntax in js
            for (let i = 1; i <= 10; i++) {
                if (i % 3 === 0) {
                    continue;   // skips this iteration of the loop
                }

                console.log(i);
                if (i == 8) {
                    break;
                }
            }
        </script>
    </body>
</html>
