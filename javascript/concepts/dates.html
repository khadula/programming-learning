<!DOCTYPE html>
<html>
    <head>
        
    </head>
    <body>
        <script>
            // date in js
            // - Objects that contain values which represent dates and times
            // - These date objects can be changed and formatted

            const date = new Date();

            // so the date object has every form of time (year, month, day, hour, minutes, seconds)
            const year = date.getFullYear();
            const month = date.getMonth();
            const day = date.getDate();
            const hour = date.getHours();

            console.log(year);
            console.log(month);
            console.log(day);
            console.log(hour);
        </script>
    </body>
</html>
