<!DOCTYPE html>
<html lang="en">
<head>
    <title>Document</title>

    
</head>
<body>



    <script>
        // Promise = an object that manages asynchronous operations.
        // - Wrap a promise object around {asynchronous code}
        // - "i promise to return a value"
        // - pending -> resolved or rejected
        // - new Promise((resolve, reject) => {asynchronous code})



        // DO THESE CHORES IN ORDER

        // 1. WALK THE DOG
        // 2. CLEAN THE KITCHEN
        // 3. TAKE OUT THE TRASH

        function walkDog() {  
            return new Promise((resolve, reject) => {
                setTimeout(() => {
                    const dogWalked = false;

                    if (dogWalked) {
                        resolve("Successfully walked the dog.");
                    } else {
                        reject("You didn't walk the dog");
                    }
                }, 1500);
            });
        }

        function cleanKitchen() {

            return new Promise((resolve, reject) => {
                setTimeout(() => {
                    const kitchenCleaned = true;

                    if (kitchenCleaned) {
                        resolve("Successfully cleaned the kitchen");
                    } else {
                        reject("You didn't clean the kitchen");
                    }
                    
                }, 2500);
            });
        }

        function takeOutTrash() {
            return new Promise((resolve, reject) => {
                setTimeout(() => {
                    const trashTaken = true;

                    if (trashTaken) {
                        resolve("Successfully took out the trash");
                    } else {
                        reject("You didn't take out the trash");
                    }
                    
                }, 500);
            });
        }

        // .then gets the data from outside of a Promise
        // this is method chaining
        walkDog().then(value => {console.log(value); return cleanKitchen()})
                .then(value => {console.log(value); return takeOutTrash()})
                .then(value => {console.log(value); console.log("You finished")})
                .catch(error => {
                    console.error(error);
                });

        


    </script>
</body>
</html>
