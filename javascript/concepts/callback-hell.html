<!DOCTYPE html>
<html lang="en">
<head>
    <title>Document</title>

    
</head>
<body>



    <script>
        // Callback Hell - Situation in JS where callbacks are nested within other callbacks 
        // - becomes difficult to read the code
        // - use promises + async/await to avoid Callback Hell


        // introduce a callback (function), and call the callback after task 1 completes
        function task1(callback) {
            // make it an asynchronous function
            setTimeout(() => {
                console.log("Task 1 complete");
                callback();
            }, 2000);
            
        }

        // each task func accepts a callback, essentially chaining callbacks
        // (like recursion sorta)
        function task2(callback) {
            setTimeout(() => {
                console.log("Task 2 complete");
                callback();
            }, 1000);
        }

        function task3(callback) {
            setTimeout(() => {
                console.log("Task 3 complete");
                callback();
            }, 3000);
        }

        function task4(callback) {
            setTimeout(() => {
                console.log("Task 4 complete");
                callback();
            }, 1500);
        }


        // This is essentially Callback Hell (gets worse as you add more levels of callbacks)
        task1(() => {
            task2(() => {
                task3(() => {
                    task4(() => {
                        console.log('All Tasks Complete');
                    })
                })
            })
        });



    </script>
</body>
</html>
