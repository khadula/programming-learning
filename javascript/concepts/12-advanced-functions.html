            /* ******************************************************************************** */

            // this is a filter function which can go through an array
            // it returns a boolean for every thing iterated over
            // if the value is true, that thing stays in the array
            // if false, it is removed from the array
            // (not technically stay/removed. it creates a whole new array)
            console.log([1, -3, 5].filter((value, index) => {
                if (value >= 0) {
                    return true;
                } else {
                    return false;
                }
            }));
            // so the above would keep only the 1 and 5

            // this is a map function which goes through an array
            // whatever is returned is added to a new array
            console.log([1, 1, 3].map((value, index) => {
                return value * 2;
            }));
            // so the above would return an array of each number doubled

            // shorthand of the above
            // since only 1 param, can remove brackets around params
            // since only 1 line, can remove squigly brackets and return keyword
            console.log([1, 1, 3].map(value => value * 2));
