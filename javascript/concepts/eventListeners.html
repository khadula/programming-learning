            // more events: keydown, keyup

            // can add an event listener to the document (DOM) to detect key presses anywhere
            document.addEventListener("keydown", event => {
                myBox.style.backgroundColor = "red";
            });

            document.addEventListener("keyup", event => {
                myBox.style.backgroundColor = "pink";
            });

            const moveAmount = 10;
            let x = 0;
            let y = 0;

            document.addEventListener("keydown", event => {

                if (event.key.startsWith("Arrow")) {

                    // prevents scrolling off the screen
                    event.preventDefault();

                    switch (event.key) {
                        case "ArrowUp":
                            y -= moveAmount;
                            console.log(y);
                            break;
                        case "ArrowDown":
                            y += moveAmount;
                            console.log(y);
                            break;
                        case "ArrowRight":
                            x += moveAmount;
                            console.log(x);
                            break;
                        case "ArrowLeft":
                            x -= moveAmount;
                            console.log(x);
                            break;
                    }

                    myBox.style.top = `${y}px`;
                    myBox.style.left = `${x}px`;
                    
                };
            });


            
        </script>
