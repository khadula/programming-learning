<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        #myBox {
            background-color: lightgreen;
            width: 300px;
            height: 300px;
            font-size: 4.5rem;
            position: relative;
            align-items: center;
            justify-content: center;
            display: flex;
        }

        #myButton {
            font-size: 2rem;
        }
    </style>
</head>
<body>
    <button id="myButton">
        Hide
    </button><br>

    <div id="myBox"></div>

    <script>
        // how to show and hide html elements


        const myButton = document.getElementById("myButton");
        const myBox = document.getElementById("myBox");

        // myButton.addEventListener("click", event => {
        //     if (myBox.style.display === "none") {
        //         myBox.style.display = "block";
        //         myButton.textContent = "hide";
        //     } else {
        //         myBox.style.display = "none";
        //         myButton.textContent = "Show";
        //     }
        // });

        // could also do the same thing with visibility - this reserves the space of the box
        myButton.addEventListener("click", event => {
            if (myBox.style.visibility === "hidden") {
                myBox.style.visibility = "visible";
                myButton.textContent = "hide";
            } else {
                myBox.style.visibility = "hidden";
                myButton.textContent = "Show";
            }
        });














    </script>
    
</body>
</html>
