<!DOCTYPE html>
<html>
<head>
    <title>Node List Practice</title>

    <style>
        .myButtons {
            font-size: 4rem;
            margin: 10px;
            border: none;
            border-radius: 5px;
            padding: 10px 15px;
            background-color: lightcoral;
        }
    </style>
</head>
<body>
    <button class="myButtons">button 1</button>
    <button class="myButtons">button 2</button>
    <button class="myButtons">button 3</button>
    <button class="myButtons">button 4</button>

    <script>
        // NodeList = Static collection of HTML elements by (id, class, element)
        // Can be created by using querySelectorAll()
        // similar to an array, but no (map, filter, reduce)
        // nodeList doesn't updadte automatically to reflect changes


        let buttons = document.querySelectorAll(".myButtons")

        // ADD HTML/CSS PROPERTIES

        // buttons.forEach(button => {
        //     button.style.backgroundColor = "lightblue";
        //     button.textContent += " :D"
        // })

        // CLICK event listener
        buttons.forEach(button => {
            button.addEventListener("click", event => {
                // target is the button we click on
                event.target.style.backgroundColor = "lightblue";
            })
        })

        // MOUSEOVER + MOUSEOUT event listener
        buttons.forEach(button => {
            button.addEventListener("mouseover", event => {
                event.target.style.backgroundColor = "lightgreen";
            })

            button.addEventListener("mouseout", event => {
                event.target.style.backgroundColor = "lightcoral";
            })
        })

        // ADD AN ELEMENT TO THE NODELIST

        const newButton = document.createElement("button"); // STEP 1 - CREATE
        newButton.textContent = "Button 5";                 // STEP 2 - give it the details
        newButton.classList = "myButtons";

        document.body.appendChild(newButton);               // STEP 3
        buttons = document.querySelectorAll(".myButtons");  // final step - rerun querySelector


        // REMOVE AN ELEMENT
        buttons.forEach(button => {
            button.addEventListener("click", event => {
                event.target.remove();  // remove method removes an element
                buttons = document.querySelectorAll(".myButtons");  // have to manually update nodelist
            })
        })


    </script>
</body>
</html>
