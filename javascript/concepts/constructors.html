    <body>
        <script>
            // constructor = special method for defining the properties and methods of objects

            // define a preset way of making an object
            function Car(make, model, year, color) {
                this.make = make,
                this.model = model,
                this.year = year,
                this.color = color
            }

            // use the new keyword to create a new car object
            const car1 = new Car("ford", "Mustang", 2024, "red");
            const car2 = new Car("ferrari", "wowza", 2023, "blue");

        </script>
    </body>
</html>
