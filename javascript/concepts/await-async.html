<!DOCTYPE html>
<html lang="en">
<head>
    <title>Document</title>

    
</head>
<body>



    <script>
        // Async/Await = Async = makes a function return a promise
        //               Await = makes an async function wait for a promise

        // - allows to write asynchronous code in a synchronous manner
        // - async doesn't have to resolve or reject parameters
        // - everything after await is placed in an event queue


        function walkDog() {  
            return new Promise((resolve, reject) => {
                setTimeout(() => {
                    const dogWalked = false;

                    if (dogWalked) {
                        resolve("Successfully walked the dog.");
                    } else {
                        reject("You didn't walk the dog");
                    }
                }, 1500);
            });
        }

        function cleanKitchen() {

            return new Promise((resolve, reject) => {
                setTimeout(() => {
                    const kitchenCleaned = true;

                    if (kitchenCleaned) {
                        resolve("Successfully cleaned the kitchen");
                    } else {
                        reject("You didn't clean the kitchen");
                    }
                    
                }, 2500);
            });
        }

        function takeOutTrash() {
            return new Promise((resolve, reject) => {
                setTimeout(() => {
                    const trashTaken = true;

                    if (trashTaken) {
                        resolve("Successfully took out the trash");
                    } else {
                        reject("You didn't take out the trash");
                    }
                    
                }, 500);
            });
        }


        // so we can do everything in a synchronous manner (no method chaining)
        async function doChores() {
            try {
                const walkDogResult = await walkDog();
                console.log(walkDogResult);

                const cleanKitchenResult = await cleanKitchen();
                console.log(cleanKitchenResult);

                const takeOutTrashResult = await takeOutTrash();
                console.log(takeOutTrashResult);

                console.log("You finished all the chores.");
            } catch(error) {
                console.error(error);
            }
        }

        doChores();

        


    </script>
</body>
</html>
